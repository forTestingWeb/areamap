<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" />

<script>
// 24時間経過で閉じる。できなければ非表示。
const limitMs = 24 * 60 * 60 * 1000;
setTimeout(() => {
  document.body.innerHTML = "";
  alert("24時間が経過したため、画面を消去します。この地図を引き続き使用する場合は、LINEのトーク画面から開きなおしてください。");
  window.close();
  if (typeof liff !== "undefined" && liff.closeWindow) {
    liff.closeWindow();
  }
}, limitMs);

// ピンチイン・ピンチアウト禁止
document.documentElement.addEventListener('touchstart', function (e) {
  if (e.touches.length >= 2) e.preventDefault();
}, { passive: false });

// ダブルタップ拡大禁止
let lastTouchTime = 0;
document.documentElement.addEventListener('touchend', function (e) {
  const now = new Date().getTime();
  if (now - lastTouchTime < 350) e.preventDefault();
  lastTouchTime = now;
}, false);
</script>
<style>
html, body { margin:0; padding:0; height:100%; width:100%; font-size:18px; font-family: sans-serif; }
#map { position:absolute; top:0; left:0; width:100%; height:100%; }

/* ローダー表示 */
#loader {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);

}

}
.layer-control-header {

<button id="geolocateBtn" class="custom-geolocate-btn" title="現在地">
  <svg viewBox="0 0 24 24"><path d="M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg>

<script>
const params = new URL(document.location).searchParams;
let lm = "", op = "", id = "", url = "";
let userId = "none";
let flag = params.get('flag') ? Number(params.get('flag')) : 0;
let iOSflag = params.get('iOSflag') ? 1 : 0;
let ext = params.get('ext');
const ua = navigator.userAgent;

const loader = document.getElementById("loader");

init();

function init() {
  liff.init({ liffId: "2005353358-O06e5Z4z" }).then(() => {
    if (liff.isInClient()) {
      // 外部ブラウザで開くオプション
      if (ext === "true") {
        const location = document.location + "&ext=true";
        liff.openWindow({ url: location, external: true });
        liff.closeWindow();
        document.title = "このウィンドウは閉じてください。";
        return;
      }
      liff.ready.then(() => {
        if (ua.indexOf('iPad') > 0 && !iOSflag) {
          const location = document.location + "&iOSflag=1";
          liff.openWindow({ url: location, external: false });
          document.title = "このウィンドウは閉じてください。";
          return;
        }
        if (!liff.isLoggedIn()) liff.login();
        if (liff.getDecodedIDToken()) {
          userId = liff.getDecodedIDToken().sub;
        }
        jump();
      });
    } else {
      if (liff.isLoggedIn()) {
        if (liff.getDecodedIDToken()) {
          userId = liff.getDecodedIDToken().sub;
        }
      } else if (!flag) {
        const ret = window.confirm("LINEでログインされていません。\n登録済みの場合、ログインするとパスワード入力が不要になります。\nログインしますか？");
        if (ret) {
          flag = 1;
          const location = document.location + "&flag=1";
          liff.login({ redirectUri: location });
          return;
        } else {
          userId = prompt("パスワードを入力してください", "") || "none";
        }
      }
      jump();
    }
  }).catch(err => {
    console.error("LIFF 初期化エラー:", err);
    jump(); // LIFFなし環境へのフォールバック
  });
}

function jump() {
  if (params.get('lm')) {
    lm = "lm=" + params.get('lm');
    if (params.get('op')) op = "&op=" + params.get('op');
    id = "&id=" + encodeURIComponent(userId);
    url = "https://script.google.com/macros/s/AKfycby-Gfboni8-IO-zIGbKdpR7V-WZ_di4aHomZHlBbGOfEaCRzO1Wpi6kIgsuxrbqwDmhxw/exec?" + lm + op + id;
  }
  loadDataFromGAS();
}

// コントロール開閉
const header = document.getElementById("layerHeader");
header.onclick = () => {
  const content = document.querySelector(".layer-control-content");
  const visible = content.style.display === "block";
  content.style.display = visible ? "none" : "block";
  const title = header.dataset.title || "地理院地図";
  header.textContent = `${title} ${visible ? "▼" : "▲"}`;
};

const markerFeatures = [];
const polygonFeatures = [];
let isMapLoaded = false, imageCache = {}, activePopup = null;
const copyright = document.getElementById("copyright");

const copyrightMap = {
  gsi: "© 国土地理院",
  esri: "© Esri, HERE, Garmin, FAO, NOAA, USGS",
  esri_sat: "© Esri, Maxar, Earthstar Geographics"
};

// レイヤー切り替え
document.querySelectorAll("input[name=basemap]").forEach(r => {
  r.addEventListener("change", () => {
    const v = r.value;
    const nameMap = { gsi: "地理院地図", esri: "Esri地図", esri_sat: "Esri衛星" };
    header.dataset.title = nameMap[v];
    document.querySelector(".layer-control-content").style.display = "none";
    header.textContent = `${nameMap[v]} ▼`;
    copyright.textContent = copyrightMap[v];

    ["gsi", "esri", "esri_sat"].forEach(layer => {
      map.setLayoutProperty(`${layer}-map-layer`, "visibility", v === layer ? "visible" : "none");
    });
  });
});

// マーカー画像生成（clearRectを追加して重なりを解消）
function createMarkerImage(shape, text, textColor, bgColor, opacity = 1.0) {
  const cacheKey = `${shape}_${text}_${textColor}_${bgColor}_${opacity}`;
  if (imageCache[cacheKey]) return Promise.resolve(imageCache[cacheKey]);

  return new Promise((resolve) => {
    const isTri = shape === "triangle";
    const shapeSvg = isTri 
      ? `<polygon points="24,4.5 45,43.5 3,43.5" fill="${bgColor}" fill-opacity="${opacity}" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />`
      : `<circle cx="24" cy="24" r="21" fill="${bgColor}" fill-opacity="${opacity}" stroke="#ffffff" stroke-width="3" />`;
    
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">${shapeSvg}<text x="24" y="${isTri ? 36 : 30}" font-size="18" font-weight="bold" font-family="sans-serif" fill="${textColor}" text-anchor="middle">${text}</text></svg>`;
    
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 48; canvas.height = 48;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 48, 48); // クリア処理
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, 48, 48);
      imageCache[cacheKey] = imgData;
      resolve(imgData);
    };
  });
}

async function updateMarkerSource() {
  if (!window.map || !map.getSource("custom-markers-source")) return;
  const geojsonFeatures = [];
  
  for (let i = 0; i < markerFeatures.length; i++) {
    const item = markerFeatures[i];
    const imgName = `marker-icon-${i}`;
    const curText = item.currentTextColor || item.textColor;
    const curBg = item.currentBgColor || item.bgColor;
    const cacheKey = `${item.shape}_${item.text}_${curText}_${curBg}_${item.opacity}`;
    
    if (!imageCache[cacheKey]) {
      imageCache[cacheKey] = await createMarkerImage(item.shape, item.text, curText, curBg, item.opacity);
    }
    if (!map.hasImage(imgName)) map.addImage(imgName, imageCache[cacheKey]);
    else map.updateImage(imgName, imageCache[cacheKey]);

    geojsonFeatures.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [item.lng, item.lat] },
      properties: { index: i, iconName: imgName }
    });
  }
  map.getSource("custom-markers-source").setData({ type: "FeatureCollection", features: geojsonFeatures });
}

function updatePolygonSource() {
  if (!window.map || !map.getSource("custom-polygons-source")) return;
  const geojsonFeatures = polygonFeatures.map(poly => {
    let coords = [...poly.coordinates];
    if (coords[0][0] !== coords[coords.length - 1][0] || coords[0][1] !== coords[coords.length - 1][1]) {
      coords.push([...coords[0]]);
    }
    return {
      type: "Feature",
      geometry: { type: "Polygon", coordinates: [coords] },
      properties: { color: poly.color || "#ff0000", fillOpacity: poly.fillOpacity ?? 0.3 }
    };
  });
  map.getSource("custom-polygons-source").setData({ type: "FeatureCollection", features: geojsonFeatures });
}

function addMarker(shape, lng, lat, text="", textColor = "#ffffff", bgColor = "#000000", popupTitle = "", popupText = "", opacity = 1.0, showButtons = true) {
  markerFeatures.push({ 
    shape, lng, lat, text: String(text), textColor, currentTextColor: textColor, 
    bgColor, currentBgColor: bgColor, popupTitle, popupText, opacity, showButtons 
  });
  if (isMapLoaded) updateMarkerSource();
}

function addPolygon(coords, color = "#ff0000", fillOpacity = 0.3) {
  polygonFeatures.push({ coordinates: coords, color, fillOpacity });
  if (isMapLoaded) updatePolygonSource();
}

// 地図初期化
window.map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      "gsi-map": { type: "raster", tiles: ["https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 18 },
      "esri-map": { type: "raster", tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19 },
      "esri_sat-map": { type: "raster", tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19 }
    },
    layers: [
      { id: "gsi-map-layer", type: "raster", source: "gsi-map" },
      { id: "esri-map-layer", type: "raster", source: "esri-map", layout: { visibility: "none" } },
      { id: "esri_sat-map-layer", type: "raster", source: "esri_sat-map", layout: { visibility: "none" } }
    ]
  },
  center: [137.157311, 34.925595], zoom: 15, maxZoom: 19, maplibreLogo: false
});

map.on("load", () => {
  map.addSource("custom-polygons-source", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "custom-polygons-fill", type: "fill", source: "custom-polygons-source", paint: { "fill-color": ["get", "color"], "fill-opacity": ["get", "fillOpacity"] } });
  map.addLayer({ id: "custom-polygons-stroke", type: "line", source: "custom-polygons-source", paint: { "line-color": ["get", "color"], "line-width": 2 } });
  
  map.addSource("custom-markers-source", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "custom-markers-layer", type: "symbol", source: "custom-markers-source", layout: { "icon-image": ["get", "iconName"], "icon-allow-overlap": true, "icon-ignore-placement": true } });

  map.addSource("user-location", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "user-location-dot", type: "circle", source: "user-location", paint: { "circle-radius": 8, "circle-color": "#2196F3", "circle-stroke-width": 2, "circle-stroke-color": "#ffffff" } });

  map.on("click", "custom-markers-layer", (e) => openMainPopup(e.features[0].properties.index));
  map.on("mouseenter", "custom-markers-layer", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "custom-markers-layer", () => map.getCanvas().style.cursor = "");
  
  isMapLoaded = true;
  if (pendingGasData) applyGasData(pendingGasData);
});

function fitMapBounds() {
  const bounds = new maplibregl.LngLatBounds();
  let hasData = false;
  markerFeatures.forEach(m => { bounds.extend([m.lng, m.lat]); hasData = true; });
  polygonFeatures.forEach(p => p.coordinates?.forEach(c => { bounds.extend(c); hasData = true; }));
  if (hasData) map.fitBounds(bounds, { padding: 50, maxZoom: 17, duration: 0 });
}

function panMapToFitPopup() {
  setTimeout(() => {
    if (!activePopup) return;
    const popupRect = activePopup.getElement()?.getBoundingClientRect();
    const mapRect = map.getContainer().getBoundingClientRect();
    if (!popupRect) return;

    let dx = 0, dy = 0, pad = 20;
    if (popupRect.top < mapRect.top + pad) dy = popupRect.top - mapRect.top - pad;
    else if (popupRect.bottom > mapRect.bottom - pad) dy = popupRect.bottom - mapRect.bottom + pad;
    if (popupRect.left < mapRect.left + pad) dx = popupRect.left - mapRect.left - pad;
    else if (popupRect.right > mapRect.right - pad) dx = popupRect.right - mapRect.right + pad;

    if (dx || dy) map.panBy([dx, dy], { duration: 300 });
  }, 50);
}

function showPopup(index, html) {
  const item = markerFeatures[index];
  if (!item) return;
  if (activePopup) activePopup.remove();
  activePopup = new maplibregl.Popup({ focusAfterOpen: false })
    .setLngLat([item.lng, item.lat])
    .setHTML(html);
  activePopup.addTo(map);
  panMapToFitPopup();
}

window.openMainPopup = function(index) {
  const item = markerFeatures[index];
  let html = item.popupTitle ? `<strong>${item.popupTitle}</strong>` : "";
  if (item.popupText) html += (html ? "<br>" : "") + item.popupText;
  
  if (item.showButtons ?? true) {
    html += `
      <div class="popup-color-btns">
        <button class="btn-green" onclick="changeColor(${index}, 'text', '#00ff00')">会えた</button>
        <button class="btn-blue" onclick="changeColor(${index}, 'text', '#0000ff')">留守</button>
        <button class="btn-yellow" onclick="changeColor(${index}, 'text', '#ffff00')">投函</button>
        <button class="btn-reset" onclick="changeColor(${index}, 'text', 'reset')">未訪問</button>
      </div>
      <hr>
      <div style="margin-top: 6px; display: flex; justify-content: flex-end;">
        <button onclick="openSubPopup(${index})" style="padding: 4px 10px; font-size: 16px; font-weight: bold; background: #f0f0f0; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">備考</button>
      </div>
    `;
  }
  showPopup(index, html);
};

window.openSubPopup = function(index) {
  const item = markerFeatures[index];
  let html = item.popupTitle ? `<strong>${item.popupTitle}</strong>` : "";
  if (item.popupText) html += (html ? "<br>" : "") + item.popupText;
  
  if (item.showButtons ?? true) {
    html += `
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 4px;">特記事項</div>
      <div class="popup-color-btns">
        <button class="btn-red" onclick="changeColor(${index}, 'bg', '#ff0000')">*拒否</button>
        <button class="btn-orange" onclick="changeColor(${index}, 'bg', '#ff9900')">手話</button>
        <button class="btn-purple" onclick="changeColor(${index}, 'bg', '#800080')">JW</button>
        <button class="btn-orange" onclick="changeColor(${index}, 'bg', '#ff9900')">空家</button>
        <button class="btn-orange" onclick="changeColor(${index}, 'bg', '#ff9900')">倉庫</button>
        <button class="btn-orange" onclick="changeColor(${index}, 'bg', '#ff9900')">欠番</button>
        <button class="btn-bg-reset" onclick="changeColor(${index}, 'bg', 'reset')">情報の削除</button>
      </div>
      <hr>
      <div style="margin-top: 8px;">
        <label style="font-size: 14px; font-weight: bold; display: block; margin-bottom: 4px;">言語の選択</label>
        <select onchange="changeColor(${index}, 'bg', this.value)" style="width: 100%; padding: 6px; font-size: 16px; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">
          <option value="" selected>報告しない</option>
          <option value="#ff9900">英語</option><option value="#ff9900">中国語</option><option value="#ff9900">ポル語</option>
          <option value="#ff9900">スぺ語</option><option value="#ff9900">タガ語</option><option value="#ff9900">ベト語</option>
          <option value="#ff9900">他の言語</option><option value="reset">削除（日本語）</option>
        </select>
      </div>
    `;
  }

  html += `
    <hr>
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 4px;">備考の編集</div>
    <textarea id="editText-${index}" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" style="width: 100%; min-height: 40px; font-size: 14px; padding: 4px; box-sizing: border-box; resize: none; overflow: hidden;">${item.popupText || ""}</textarea>
    <div style="margin-top: 6px;"><button onclick="saveText(${index})" style="padding: 4px 10px; font-size: 16px; font-weight: bold; background: #0078d4; color: #fff; border: none; border-radius: 3px; cursor: pointer;">保存</button></div>
    <hr>
    <div style="margin-top: 6px; display: flex; justify-content: flex-end;">
      <button onclick="openMainPopup(${index})" style="padding: 4px 10px; font-size: 16px; font-weight: bold; background: #f0f0f0; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">戻る</button>
    </div>
  `;
  showPopup(index, html);
  setTimeout(() => {
    const ta = document.getElementById(`editText-${index}`);
    if (ta) ta.style.height = ta.scrollHeight + 'px';
  }, 50);
};

// 色・ステータスの変更とGASへのデータ同期
window.changeColor = function(index, type, code) {
  const item = markerFeatures[index];
  if (!item) return;
  if (type === 'text') item.currentTextColor = code === 'reset' ? item.textColor : code;
  if (type === 'bg') item.currentBgColor = code === 'reset' ? item.bgColor : code;
  updateMarkerSource();

  sendDataToGAS({
    action: "updateColor",
    index: index,
    type: type,
    color: code,
    userId: userId
  });
};

// 備考テキストの保存とGASへのデータ同期
window.saveText = function(index) {
  const ta = document.getElementById(`editText-${index}`);
  if (ta) {
    const newText = ta.value;
    markerFeatures[index].popupText = newText;
    updateMarkerSource();
    
    sendDataToGAS({
      action: "updateText",
      index: index,
      popupText: newText,
      userId: userId
    }).then(() => {
      alert("備考を保存しました");
    }).catch(() => {
      alert("通信エラーが発生しました。保存に失敗した可能性があります。");
    });
  }
};

// GASへデータを保存するPOST関数
async function sendDataToGAS(payload) {
  if (!url) return;
  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.error("GASへの保存送信エラー:", err);
    throw err;
  }
}

// 現在地・追従
let watchId = null, isTracking = false;
const btn = document.getElementById("geolocateBtn");

btn.addEventListener("click", () => {
  if (!isTracking) {
    if (!navigator.geolocation) return alert("位置情報に対応していません。");
    isTracking = true;
    btn.classList.add("active");
    watchId = navigator.geolocation.watchPosition(
      pos => {
        const coords = [pos.coords.longitude, pos.coords.latitude];
        map.getSource("user-location")?.setData({ type: "FeatureCollection", features: [{ type: "Feature", geometry: { type: "Point", coordinates: coords }, properties: {} }] });
        map.easeTo({ center: coords, zoom: map.getZoom(), duration: 300 });
      },
      () => { alert("位置情報の取得に失敗しました。"); stopTracking(); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  } else {
    stopTracking();
  }
});

function stopTracking() {
  isTracking = false;
  btn.classList.remove("active");
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  map.getSource("user-location")?.setData({ type: "FeatureCollection", features: [] });
}

// データ読み込み（GAS / ダミー）
let pendingGasData = null;
function applyGasData(data) {
  if (data.title) document.title = data.title;
  data.markers?.forEach(m => addMarker(m.shape || "circle", m.lng, m.lat, m.text, m.textColor, m.bgColor, m.popupTitle, m.popupText, m.opacity, m.showButtons));
  data.polygons?.forEach(p => addPolygon(p.coords, p.color, p.opacity));
  fitMapBounds();
}

async function loadDataFromGAS() {
  if (!url) {
    pendingGasData = {
      title: "【ダミーデータ】岡崎市エリアマップ",
      markers: [
        { shape: "circle", lng: 137.157311, lat: 34.925595, text: "101", textColor: "#ffffff", bgColor: "#000000", popupTitle: "ポップアップ1", popupText: "丸型マーカーのダミーテキスト", opacity: 0.5, showButtons: true },
        { shape: "triangle", lng: 137.160000, lat: 34.927000, text: "AA", textColor: "#ffffff", bgColor: "#ff0000", popupTitle: "ポップアップ2", popupText: "三角マーカーのダミーテキスト", opacity: 1.0, showButtons: false }
      ],
      polygons: [
        { coords: [[137.153, 34.923], [137.158, 34.923], [137.158, 34.926], [137.153, 34.926]], color: "#ff0000", opacity: 0.3 },
        { coords: [[137.159, 34.923], [137.164, 34.923], [137.164, 34.926], [137.159, 34.926]], color: "#0078d4", opacity: 0.5 },
        { coords: [[137.155, 34.927], [137.161, 34.927], [137.158, 34.930]], color: "#ffaa00", opacity: 0.4 }
      ]
    };
    if (isMapLoaded) applyGasData(pendingGasData);
    if (loader) loader.style.display = "none";
    return;
  }
  
  try {
    const res = await fetch(url);
    pendingGasData = await res.json();
    if (isMapLoaded) applyGasData(pendingGasData);
  } catch (err) {
    console.error("GASデータの取得に失敗しました:", err);
  } finally {
    if (loader) loader.style.display = "none";
  }
}
</script>
