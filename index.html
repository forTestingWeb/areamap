<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>

<style>
html, body { margin:0; padding:0; height:100%; width:100%; font-size:18px; }
#map { position:absolute; top:0; left:0; width:100%; height:100%; }

.layer-control {
  position:absolute; top:10px; right:10px;
  background:white; border-radius:4px;
  box-shadow:0 0 6px rgba(0,0,0,0.3);
  font-size:14px; z-index:10; width:130px;
}
.layer-control-header {
  padding:8px 10px; background:#f8f9fa; cursor:pointer;
  border-bottom:1px solid #ccc; font-weight:bold; user-select:none;
}
.layer-control-content { padding:8px 10px; display:none; }
.layer-control label { display:block; margin-bottom:6px; cursor:pointer; }

.maplibregl-popup { max-width:320px !important; }
.maplibregl-popup-content { font-size:16px; max-height:600px; overflow-y:auto; padding:15px 10px 10px 10px; }

/* ポップアップ内のカラーボタン用スタイル */
.popup-color-btns {
  margin-top: 8px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.popup-color-btns button {
  padding: 4px 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 3px;
  cursor: pointer;
  font-weight: bold;
}
.btn-green { background: #00ff00; color: #000000; border-color: #1e7e34; }
.btn-blue { background: #0000ff; color: #ffffff; border-color: #0056b3; }
.btn-yellow { background: #ffff00; color: #000000; border-color: #d39e00; }
.btn-reset { background: #ffffff; color: #333333; border-color: #ccc; }

.btn-red { background: #ff0000; color: #ffffff; border-color: #cc0000; }
.btn-orange { background: #ff9900; color: #000000; border-color: #cc7a00; }
.btn-purple { background: #800080; color: #ffffff; border-color: #590059; }
.btn-bg-reset { background: #ffffff; color: #333333; border-color: #ccc; }

.popup-color-btns button:hover {
  opacity: 0.85;
}

/* 自作の現在地ボタンのデザイン */
.custom-geolocate-btn {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: white;
  border: none;
  border-radius: 4px;
  width: 36px;
  height: 36px;
  box-shadow: 0 0 6px rgba(0,0,0,0.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.custom-geolocate-btn svg {
  width: 20px;
  height: 20px;
  fill: #333;
}
.custom-geolocate-btn.active svg {
  fill: #0078d4;
}

.maplibregl-marker {
  z-index: 99999 !important;
}

#copyright {
  position:absolute; right:10px; bottom:10px;
  background:rgba(255,255,255,0.85); padding:4px 8px;
  border-radius:4px; font-size:12px; z-index:20; pointer-events:none;
}
</style>
</head>

<body>
<div id="map"></div>
<div id="copyright">© 国土地理院</div>

<!-- 自作の現在地ボタン -->
<button id="geolocateBtn" class="custom-geolocate-btn" title="現在地">
  <svg viewBox="0 0 24 24"><path d="M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg>
</button>

<div class="layer-control">
  <div class="layer-control-header" id="layerHeader">国土地理院 ▼</div>
  <div class="layer-control-content">
    <label><input type="radio" name="basemap" value="gsi" checked> 国土地理院</label>
    <label><input type="radio" name="basemap" value="esri"> Esri地図</label>
    <label><input type="radio" name="basemap" value="esri_sat"> Esri衛星</label>
  </div>
</div>

<script>
// コントロール開閉
document.querySelector(".layer-control-header").onclick = () => {
  const content = document.querySelector(".layer-control-content");
  const header = document.querySelector(".layer-control-header");
  const visible = content.style.display === "block";
  content.style.display = visible ? "none" : "block";
  const current = header.dataset.title || "国土地理院";
  header.textContent = visible ? `${current} ▼` : `${current} ▲`;
};

const markerFeatures = [];
const polygonFeatures = [];
let isMapLoaded = false;
const imageCache = {};
let activePopup = null;

// レイヤー切り替え
const copyright = document.getElementById("copyright");
const copyrightMap = {
  gsi: "© 国土地理院",
  gsi_pale: "© 国土地理院",
  esri: "© Esri, HERE, Garmin, FAO, NOAA, USGS",
  esri_sat: "© Esri, Maxar, Earthstar Geographics"
};

const header = document.getElementById("layerHeader");

document.querySelectorAll("input[name=basemap]").forEach(r => {
  r.addEventListener("change", () => {
    const v = r.value;
    const nameMap = { gsi: "国土地理院", esri: "Esri 地図", esri_sat: "Esri衛星" };
    header.dataset.title = nameMap[v];
    const content = document.querySelector(".layer-control-content");
    const visible = content.style.display === "block";
    header.textContent = visible ? `${nameMap[v]} ▲` : `${nameMap[v]} ▼`;
    copyright.textContent = copyrightMap[v];

    map.setLayoutProperty("gsi-map-layer", "visibility", v === "gsi" ? "visible" : "none");
    map.setLayoutProperty("esri-map-layer", "visibility", v === "esri" ? "visible" : "none");
    map.setLayoutProperty("esri-sat-layer", "visibility", v === "esri_sat" ? "visible" : "none");
  });
});

function createMarkerImage(shape, text, textColor, bgColor, opacity = 1.0) {
  const cacheKey = `${shape}_${text}_${textColor}_${bgColor}_${opacity}`;
  if (imageCache[cacheKey]) return Promise.resolve(imageCache[cacheKey]);

  return new Promise((resolve) => {
    const isTri = shape === "triangle";
    const shapeSvg = isTri 
      ? `<polygon points="24,4.5 45,43.5 3,43.5" fill="${bgColor}" fill-opacity="${opacity}" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />`
      : `<circle cx="24" cy="24" r="21" fill="${bgColor}" fill-opacity="${opacity}" stroke="#ffffff" stroke-width="3" />`;
    const textY = isTri ? 36 : 30;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">${shapeSvg}<text x="24" y="${textY}" font-size="18" font-weight="bold" font-family="sans-serif" fill="${textColor}" text-anchor="middle">${text}</text></svg>`;
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 48; canvas.height = 48;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, 48, 48);
      imageCache[cacheKey] = imgData;
      resolve(imgData);
    };
  });
}

async function updateMarkerSource() {
  if (!window.map || !map.getSource("custom-markers-source")) return;
  const geojsonFeatures = [];
  for (let i = 0; i < markerFeatures.length; i++) {
    const item = markerFeatures[i];
    const imgName = `marker-icon-${i}`;
    const currentTextColor = item.currentTextColor || item.textColor;
    const currentBgColor = item.currentBgColor || item.bgColor;
    const cacheKey = `${item.shape}_${item.text}_${currentTextColor}_${currentBgColor}_${item.opacity}`;
    if (!imageCache[cacheKey]) {
      const imageData = await createMarkerImage(item.shape, item.text, currentTextColor, currentBgColor, item.opacity);
      imageCache[cacheKey] = imageData;
    }
    if (!map.hasImage(imgName)) map.addImage(imgName, imageCache[cacheKey]);
    else map.updateImage(imgName, imageCache[cacheKey]);
    geojsonFeatures.push({
      type: "Feature",
      geometry: { type: "Point", coordinates: [item.lng, item.lat] },
      properties: { index: i, iconName: imgName, popupTitle: item.popupTitle, popupText: item.popupText, showButtons: item.showButtons ?? true }
    });
  }
  map.getSource("custom-markers-source").setData({ type: "FeatureCollection", features: geojsonFeatures });
}

function updatePolygonSource() {
  if (!window.map || !map.getSource("custom-polygons-source")) return;
  const geojsonFeatures = polygonFeatures.map(poly => {
    const coords = [...poly.coordinates];
    if (coords[0][0] !== coords[coords.length - 1][0] || coords[0][1] !== coords[coords.length - 1][1]) {
      coords.push([...coords[0]]);
    }
    return {
      type: "Feature",
      geometry: { type: "Polygon", coordinates: [coords] },
      properties: { color: poly.color || "#ff0000", fillOpacity: poly.fillOpacity ?? 0.3 }
    };
  });

  map.getSource("custom-polygons-source").setData({ type: "FeatureCollection", features: geojsonFeatures });
}

function addCircleMarker(lng, lat, text="", textColor = "#ffffff", bgColor = "#000000", popupTitle = "", popupText = "", opacity = 1.0, showButtons = true) {
  markerFeatures.push({ 
    shape: "circle", lng, lat, text: String(text), textColor, currentTextColor: textColor, bgColor, currentBgColor: bgColor, popupTitle, popupText, opacity, showButtons 
  });
  if (isMapLoaded) updateMarkerSource();
}

function addTriangleMarker(lng, lat, text="", textColor = "#ffffff", bgColor = "#ff0000", popupTitle = "", popupText = "", opacity = 1.0, showButtons = true) {
  markerFeatures.push({ 
    shape: "triangle", lng, lat, text: String(text), textColor, currentTextColor: textColor, bgColor, currentBgColor: bgColor, popupTitle, popupText, opacity, showButtons 
  });
  if (isMapLoaded) updateMarkerSource();
}

function addPolygon(coords, color = "#ff0000", fillOpacity = 0.3) {
  polygonFeatures.push({ coordinates: coords, color, fillOpacity });
  if (isMapLoaded) updatePolygonSource();
}

// 地図初期化
window.map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      "gsi-map": { type: "raster", tiles: ["https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png"], tileSize: 256, maxzoom: 18 },
      "esri-map": { type: "raster", tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19 },
      "esri-sat": { type: "raster", tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19 }
    },
    layers: [
      { id: "gsi-map-layer", type: "raster", source: "gsi-map" },
      { id: "esri-map-layer", type: "raster", source: "esri-map", layout: { visibility: "none" } },
      { id: "esri-sat-layer", type: "raster", source: "esri-sat", layout: { visibility: "none" } }
    ]
  },
  center: [137.157311, 34.925595],
  zoom: 15,
  maxZoom: 19,
  maplibreLogo: false
});

// --- 現在地・追従ロジック ---
let watchId = null;
let isTracking = false;
const btn = document.getElementById("geolocateBtn");

map.on("load", () => {
  map.addSource("custom-polygons-source", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "custom-polygons-fill", type: "fill", source: "custom-polygons-source", paint: { "fill-color": ["get", "color"], "fill-opacity": ["get", "fillOpacity"] } });
  map.addLayer({ id: "custom-polygons-stroke", type: "line", source: "custom-polygons-source", paint: { "line-color": ["get", "color"], "line-width": 2 } });
  
  map.addSource("custom-markers-source", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "custom-markers-layer", type: "symbol", source: "custom-markers-source", layout: { "icon-image": ["get", "iconName"], "icon-allow-overlap": true, "icon-ignore-placement": true } });

  map.addSource("user-location", {
    type: "geojson",
    data: { type: "FeatureCollection", features: [] }
  });
  map.addLayer({
    id: "user-location-dot", 
    type: "circle", 
    source: "user-location",
    paint: {
      "circle-radius": 8,
      "circle-color": "#2196F3",
      "circle-stroke-width": 2,
      "circle-stroke-color": "#ffffff"
    }
  });

  map.on("click", "custom-markers-layer", (e) => {
    const f = e.features[0];
    const index = f.properties.index;
    openMainPopup(index, f.geometry.coordinates[0], f.geometry.coordinates[1]);
  });
  
  map.on("mouseenter", "custom-markers-layer", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "custom-markers-layer", () => map.getCanvas().style.cursor = "");
  
  isMapLoaded = true;
  if (pendingGasData) applyGasData(pendingGasData);
});

// 全マーカーとポリゴンが収まるように初期表示を自動調整する関数
function fitMapBounds() {
  const bounds = new maplibregl.LngLatBounds();
  let hasData = false;

  markerFeatures.forEach(m => {
    bounds.extend([m.lng, m.lat]);
    hasData = true;
  });

  polygonFeatures.forEach(p => {
    if (p.coordinates && Array.isArray(p.coordinates)) {
      p.coordinates.forEach(coord => {
        bounds.extend(coord);
        hasData = true;
      });
    }
  });

  if (hasData) {
    map.fitBounds(bounds, {
      padding: 50,
      maxZoom: 17,
      duration: 0
    });
  }
}

// 元のポップアップを開く関数
window.openMainPopup = function(index, lng, lat) {
  const item = markerFeatures[index];
  if (!item) return;

  const title = item.popupTitle;
  const text = item.popupText;
  let html = title ? `<strong>${title}</strong>` : "";
  if (text) html += (html ? "<br>" : "") + text;
  if (item.showButtons ?? true) {
    html += `
      <div class="popup-color-btns">
        <button class="btn-green" onclick="changeMarkerTextColor(${index}, '#00ff00')">会えた</button>
        <button class="btn-blue" onclick="changeMarkerTextColor(${index}, '#0000ff')">留守</button>
        <button class="btn-yellow" onclick="changeMarkerTextColor(${index}, '#ffff00')">投函</button>
        <button class="btn-reset" onclick="changeMarkerTextColor(${index}, 'reset')">未訪問</button>
      </div>
    `;
    html += `
      <hr>
      <div style="margin-top: 6px; display: flex; justify-content: flex-end;">
        <button onclick="openSubPopup(${index}, ${lng}, ${lat})" style="padding: 4px 10px; font-size: 12px; background: #f0f0f0; color: #333; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">備考の編集</button>
      </div>
    `;
  }

  if (activePopup) activePopup.remove();
  activePopup = new maplibregl.Popup({ focusAfterOpen: false })
    .setLngLat([lng, lat])
    .setHTML(html);
  activePopup.addTo(map);
};

window.changeMarkerTextColor = function(index, colorCode) {
  const item = markerFeatures[index];
  if (!item) return;
  item.currentTextColor = colorCode === 'reset' ? item.textColor : colorCode;
  updateMarkerSource();
};

window.changeMarkerBgColor = function(index, colorCode) {
  const item = markerFeatures[index];
  if (!item) return;
  item.currentBgColor = colorCode === 'reset' ? item.bgColor : colorCode;
  updateMarkerSource();
};

window.openSubPopup = function(index, lng, lat) {
  const item = markerFeatures[index];
  if (!item) return;

  let subHtml = item.popupTitle ? `<strong>${item.popupTitle}</strong>` : "";
  if (item.popupText) subHtml += (subHtml ? "<br>" : "") + item.popupText;
  
  if (item.showButtons ?? true) {
    subHtml += `
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 4px;">特記事項</div>
      <div class="popup-color-btns">
        <button class="btn-red" onclick="changeMarkerBgColor(${index}, '#ff0000')">*拒否</button>
        <button class="btn-orange" onclick="changeMarkerBgColor(${index}, '#ff9900')">手話</button>
        <button class="btn-purple" onclick="changeMarkerBgColor(${index}, '#800080')">JW</button>
        <button class="btn-orange" onclick="changeMarkerBgColor(${index}, '#ff9900')">空家</button>
        <button class="btn-orange" onclick="changeMarkerBgColor(${index}, '#ff9900')">倉庫</button>
        <button class="btn-orange" onclick="changeMarkerBgColor(${index}, '#ff9900')">欠番</button>
        <button class="btn-bg-reset" onclick="changeMarkerBgColor(${index}, 'reset')">情報の削除</button>
      </div>
      <hr>
      <!-- 言語選択用セレクトボックス -->
      <div style="margin-top: 8px;">
        <label for="langSelect-${index}" style="font-size: 14px; font-weight: bold; display: block; margin-bottom: 4px;">言語の選択</label>
        <select id="langSelect-${index}" onchange="handleLangChange(${index}, this.value)" style="width: 100%; padding: 6px; font-size: 16px; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">
          <option value="" selected>報告しない</option>
          <option value="#ff9900">英語</option>
          <option value="#ff9900">中国語</option>
          <option value="#ff9900">ポル語</option>
          <option value="#ff9900">スぺ語</option>
          <option value="#ff9900">タガ語</option>
          <option value="#ff9900">ベト語</option>
          <option value="#ff9900">他の言語</option>
          <option value="reset">削除（日本語）</option>
        </select>
      </div>
    `;
  }

  // 備考の編集欄（自動リサイズ・手動リサイズ禁止）
  const currentText = item.popupText || "";
  subHtml += `
    <hr>
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 4px;">備考の編集</div>
    <textarea id="editPopupText-${index}" oninput="autoResizeTextarea(this)" style="width: 100%; min-height: 40px; font-size: 14px; padding: 4px; box-sizing: border-box; resize: none; overflow: hidden;">${currentText}</textarea>
    <div style="margin-top: 6px;">
      <button onclick="savePopupText(${index})" style="padding: 4px 10px; font-size: 12px; background: #0078d4; color: #fff; border: none; border-radius: 3px; cursor: pointer;">保存</button>
    </div>
    <hr>
    <div style="margin-top: 6px; display: flex; justify-content: flex-end;">
      <button onclick="openMainPopup(${index}, ${lng}, ${lat})" style="padding: 4px 10px; font-size: 12px; background: #f0f0f0; color: #333; border: 1px solid #ccc; border-radius: 3px; cursor: pointer;">戻る</button>
    </div>
  `;

  if (activePopup) activePopup.remove();

  activePopup = new maplibregl.Popup({ focusAfterOpen: false })
    .setLngLat([lng, lat])
    .setHTML(subHtml);

  activePopup.addTo(map);

  // ポップアップが開いた直後、初期テキストの高さに合わせて高さを調整
  setTimeout(() => {
    const ta = document.getElementById(`editPopupText-${index}`);
    if (ta) autoResizeTextarea(ta);
  }, 50);
};

// セレクトボックスで言語が変更されたときの処理
window.handleLangChange = function(index, colorCode) {
  changeMarkerBgColor(index, colorCode);
};

// テキストエリアの高さを自動調整する関数
window.autoResizeTextarea = function(el) {
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight) + 'px';
};

// 編集した備考を保存する関数
window.savePopupText = function(index) {
  const item = markerFeatures[index];
  if (!item) return;
  const textarea = document.getElementById(`editPopupText-${index}`);
  if (textarea) {
    item.popupText = textarea.value;
    updateMarkerSource();
    alert("備考を保存しました");
  }
};

btn.addEventListener("click", () => {
  if (!isTracking) {
    if (!navigator.geolocation) {
      alert("お使いのブラウザは位置情報に対応していません。");
      return;
    }
    isTracking = true;
    btn.classList.add("active");
    watchId = navigator.geolocation.watchPosition(
      (position) => {
        const lng = position.coords.longitude;
        const lat = position.coords.latitude;
        const source = map.getSource("user-location");
        if (source) {
          source.setData({
            type: "FeatureCollection",
            features: [{
              type: "Feature",
              geometry: { type: "Point", coordinates: [lng, lat] },
              properties: {}
            }]
          });
        }
        const currentZoom = map.getZoom();
        map.easeTo({ center: [lng, lat], zoom: currentZoom, duration: 300 });
      },
      (error) => {
        console.error(error);
        alert("位置情報の取得に失敗しました。");
        stopTracking();
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  } else {
    stopTracking();
  }
});

function stopTracking() {
  isTracking = false;
  btn.classList.remove("active");
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  const source = map.getSource("user-location");
  if (source) {
    source.setData({ type: "FeatureCollection", features: [] });
  }
}

let pendingGasData = null;
function applyGasData(data) {
  if (data.title) document.title = data.title;
  if (data.markers) {
    data.markers.forEach(m => {
      if (m.shape === "triangle") addTriangleMarker(m.lng, m.lat, m.text, m.textColor, m.bgColor, m.popupTitle, m.popupText, m.opacity, m.showButtons);
      else addCircleMarker(m.lng, m.lat, m.text, m.textColor, m.bgColor, m.popupTitle, m.popupText, m.opacity, m.showButtons);
    });
  }
  if (data.polygons) {
    data.polygons.forEach(p => addPolygon(p.coords, p.color, p.opacity));
  }
  // 全データの読み込みと描画準備が終わったタイミングで全体が収まるようにズーム調整
  fitMapBounds();
}

async function loadDataFromGAS() {
  const GAS_URL = "YOUR_GAS_WEB_APP_URL_HERE";

  if (!GAS_URL || GAS_URL.includes("YOUR_GAS_WEB_APP_URL")) {
    pendingGasData = {
      title: "【ダミーデータ】岡崎市エリアマップ",
      markers: [
        { shape: "circle", lng: 137.157311, lat: 34.925595, text: "101", textColor: "#ffffff", bgColor: "#000000", popupTitle: "ポップアップ1", popupText: "丸型マーカーのダミーテキスト", opacity: 0.5, showButtons: true },
